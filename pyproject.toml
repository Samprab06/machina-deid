[project]
name = "machina-deid"
version = "0.1.0"
description = "Format-aware pseudonymization pipeline for the Machina CAD De-ID challenge"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=6.0", "pymupdf>=1.24"]
image = ["Pillow>=10.0"]
cad = ["ezdxf>=1.3"]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
